# release-drafter 설정 — dev 로 머지되는 PR 을 라벨 기준으로 카테고리 묶어 draft release
# 노트를 자동 초안. 실제 릴리즈 게시는 `.github/workflows/release.yml` (CHANGELOG.md 기반)
# 이 담당하고, 이 draft 는 사람이 CHANGELOG.md 로 옮길 때 참고용 · 붙여넣기용으로만 활용.
#
# 사용법:
#  1. PR 에 프로젝트 라벨 (💻 Feat / 🛠️ Fix / 🪄 Refactor / ⚙️ Setting / 🔥 Bug) 을 붙임 (이슈 템플릿이 이미 자동 지정)
#  2. dev 로 머지되면 release-drafter 가 GitHub Releases 의 draft 를 자동 갱신
#  3. 릴리즈 시점에 draft 본문을 CHANGELOG.md 의 `## [Unreleased]` 아래로 정리해서 옮기고 release 브랜치 push

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# PR 라벨 → 섹션 매핑. 프로젝트 이슈 템플릿 라벨과 동일.
categories:
  - title: '## 신규 기능'
    labels:
      - '💻 Feat'
  - title: '## 개선'
    labels:
      - '🪄 Refactor'
  - title: '## 버그 수정'
    labels:
      - '🛠️ Fix'
      - '🔥 Bug'
  - title: '## 기타'
    labels:
      - '⚙️ Setting'

# 항목 포맷 — PR 제목 · 작성자 · 번호. 이슈 참조번호 (`[#N]`) 는 제목에 이미 들어있음.
change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'   # `_` 를 이탤릭으로 안 잡히게

# semver bump 감지. 라벨로 강제.
version-resolver:
  major:
    labels: ['breaking']
  minor:
    labels: ['💻 Feat']
  patch:
    labels: ['🛠️ Fix', '🔥 Bug', '🪄 Refactor', '⚙️ Setting']
  default: patch

# draft body 골격.
template: |
  $CHANGES

  ---
  전체 변경사항: https://github.com/hyunjine/linker/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
