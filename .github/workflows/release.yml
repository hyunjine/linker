# release 브랜치에 push 되면 `iosApp/Configuration/Config.xcconfig` 의
# MARKETING_VERSION 을 읽어 `vX.Y.Z` 태그와 GitHub Release 를 자동 생성한다.
# 릴리즈 노트 본문은 `CHANGELOG.md` 의 최상단 (Unreleased 제외한 첫 `## [X.Y.Z]`
# 섹션) 을 그대로 게시한다.
#
# 정책:
#   - MARKETING_VERSION 과 동일한 `v*` 태그가 이미 존재하면 skip (중복 방지)
#   - CHANGELOG 최상단 버전이 MARKETING_VERSION 과 다르면 실패 (동기화 강제)
#   - Xcode Cloud 는 이 워크플로와 무관하게 별도로 아카이브를 만든다 — 두 흐름은 독립적
name: Release Automation

on:
  push:
    branches: [release]

concurrency:
  group: release-automation
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse Config.xcconfig + CHANGELOG.md
        id: parse
        run: |
          XCCONFIG=iosApp/Configuration/Config.xcconfig
          CHANGELOG=CHANGELOG.md
          [ -f "$XCCONFIG" ] || { echo "::error::$XCCONFIG missing"; exit 1; }
          [ -f "$CHANGELOG" ] || { echo "::error::$CHANGELOG missing"; exit 1; }

          # MARKETING_VERSION= 라인에서 값 추출.
          VERSION=$(grep -m 1 '^MARKETING_VERSION=' "$XCCONFIG" | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::MARKETING_VERSION not found in $XCCONFIG"
            exit 1
          fi

          # CHANGELOG.md 에서 첫 `## [X.Y.Z]` (순수 semver) 헤더를 찾고 그 다음 semver 헤더
          # 전까지를 body 로 추출. 비-semver 헤더 (예: `## [X.Y.Z · 개발자 노트]`) 는 delimiter
          # 로 취급하지 않고 body 안에 그대로 포함 — GitHub Release 본문엔 사용자·개발자 노트가
          # 모두 게시된다. 앱은 body 를 받아 렌더할 때 `## [` 만나면 렌더링을 멈춰 사용자 섹션
          # 만 노출한다 (ReleaseNotesScreen 참고).
          #
          # awk 로직:
          #   - 상태 f=1: 첫 번째 non-Unreleased **semver** 헤더를 만난 후 본문 수집
          #   - 그 다음 **semver** 헤더 만나면 종료 (개발자 노트 헤더는 무시)
          awk '
            /^## \[Unreleased\]/ { next }
            /^## \[[0-9]+\.[0-9]+\.[0-9]+\]/ {
              if (f) exit
              # 헤더 자체는 노트에 포함하지 않음 (GitHub Release 가 tag 로 제목 대체)
              match($0, /## \[([^]]+)\]/, m)
              found_version = m[1]
              f = 1
              next
            }
            f { print }
          ' "$CHANGELOG" | awk 'NF{f=1} f' > notes.md

          # 정합성 체크: CHANGELOG 첫 버전 == MARKETING_VERSION
          CHANGELOG_VERSION=$(grep -m 1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' "$CHANGELOG" | sed -E 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/')
          if [ "$VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "::error::버전 불일치: MARKETING_VERSION=$VERSION vs CHANGELOG 첫 버전=$CHANGELOG_VERSION. 두 값을 맞춰주세요."
            exit 1
          fi

          # 트레일링 공백 라인 제거.
          sed -i -e ':a' -e '/^\s*$/{$d;N;ba' -e '}' notes.md 2>/dev/null || true

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "── Version: $VERSION ──"
          echo "── Notes preview ──"
          head -30 notes.md

      - name: Check if tag already exists (skip if yes)
        id: tag_check
        run: |
          TAG="${{ steps.parse.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists — skipping release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.parse.outputs.tag }}" \
            --title "${{ steps.parse.outputs.tag }}" \
            --notes-file notes.md \
            --target "${{ github.sha }}"

      # 신규 태그를 새로 만든 경우에만 (재실행·중복 방지) 전체 유저에게 업데이트 안내 push (#300).
      # 함수는 shared secret 헤더로 인증 — 관리자 JWT 가 워크플로에 없으므로 send-announcement 대신
      # 신설한 broadcast-release-note 함수를 호출한다.
      #
      # curl 실패 시 릴리즈는 이미 게시된 상태 → workflow 는 실패로 처리해 재시도 유도.
      # 재시도는 Actions 탭 rerun 시 tag 이미 존재해 이 스텝만 다시 발동하지 않는다 →
      # 실무상 Actions 재실행이 불가하면 curl 을 로컬에서 수동으로 다시 쏘면 된다.
      - name: Broadcast release note push (전체 유저)
        if: steps.tag_check.outputs.exists == 'false'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RELEASE_BROADCAST_SECRET: ${{ secrets.RELEASE_BROADCAST_SECRET }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          # ── STAGE 1: secret presence 확인 (값은 절대 출력 X, boolean 만) ──
          echo "── secret presence ──"
          echo "SUPABASE_URL              : $([ -n "$SUPABASE_URL" ] && echo present || echo MISSING)"
          echo "SUPABASE_ANON_KEY         : $([ -n "$SUPABASE_ANON_KEY" ] && echo present || echo MISSING)"
          echo "RELEASE_BROADCAST_SECRET  : $([ -n "$RELEASE_BROADCAST_SECRET" ] && echo present || echo MISSING)"
          echo "VERSION                   : $VERSION"

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$RELEASE_BROADCAST_SECRET" ]; then
            echo "::error::브로드캐스트 secret 누락 (SUPABASE_URL · SUPABASE_ANON_KEY · RELEASE_BROADCAST_SECRET 확인)"
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::VERSION output 누락 — parse 스텝 확인"
            exit 1
          fi

          # ── STAGE 2: 호출 ──
          # -sS: silent 하되 에러 표시. -w: HTTP status 캡처. --max-time: 함수 timeout 대비 여유.
          # payload 에 source=workflow 를 명시해 감사 로그에서 수동 curl 과 구분 가능.
          echo "── invoking broadcast-release-note ──"
          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" \
            --max-time 60 \
            -X POST "$SUPABASE_URL/functions/v1/broadcast-release-note" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-release-broadcast-secret: $RELEASE_BROADCAST_SECRET" \
            -d "{\"version\":\"$VERSION\",\"source\":\"workflow\"}") || {
              echo "::error::curl 자체 실패 (network / dns / timeout)"
              exit 1
            }

          # ── STAGE 3: 응답 로깅 ──
          echo "── broadcast response (HTTP $HTTP_STATUS) ──"
          cat response.json 2>/dev/null || echo "(빈 응답)"
          echo

          # ── STAGE 4: 응답 검증 (HTTP + JSON 필드) ──
          if [ "$HTTP_STATUS" != "200" ]; then
            REQ_ID=$(jq -r '.requestId // "(없음)"' response.json 2>/dev/null || echo "(파싱 불가)")
            ERR=$(jq -r '.error // "(없음)"' response.json 2>/dev/null || echo "(파싱 불가)")
            echo "::error::broadcast HTTP=$HTTP_STATUS requestId=$REQ_ID error=$ERR"
            exit 1
          fi

          REQ_ID=$(jq -r '.requestId' response.json)
          SENT=$(jq -r '.sent' response.json)
          FAILED=$(jq -r '.failed' response.json)
          TOTAL=$(jq -r '.devicesTotal' response.json)
          IDEMPOTENT=$(jq -r '.alreadyBroadcasted' response.json)

          echo "── summary ──"
          echo "requestId          : $REQ_ID"
          echo "version            : $VERSION"
          echo "devicesTotal       : $TOTAL"
          echo "sent               : $SENT"
          echo "failed             : $FAILED"
          echo "alreadyBroadcasted : $IDEMPOTENT"

          # GitHub Actions summary (Actions UI 요약 카드에 노출).
          {
            echo "### 📣 Release note broadcast"
            echo ""
            echo "| 필드 | 값 |"
            echo "|---|---|"
            echo "| version | \`$VERSION\` |"
            echo "| requestId | \`$REQ_ID\` |"
            echo "| devicesTotal | $TOTAL |"
            echo "| sent | $SENT |"
            echo "| failed | $FAILED |"
            echo "| alreadyBroadcasted | $IDEMPOTENT |"
            echo ""
            echo "Supabase 로그에서 \`rid=$REQ_ID\` 로 stage 별 추적 가능."
          } >> "$GITHUB_STEP_SUMMARY"

          # ── STAGE 5: 실패 신호 판정 ──
          # devices 0 인 상태는 "발송할 대상 없음" → warning 만.
          # devices >0 인데 sent=0 이면 명백한 실패 → workflow fail.
          if [ "$TOTAL" -gt 0 ] && [ "$SENT" = "0" ]; then
            echo "::error::device $TOTAL 개 중 0건 성공 · 전부 실패. requestId=$REQ_ID"
            exit 1
          fi
          if [ "$TOTAL" = "0" ]; then
            echo "::warning::user_devices 가 비어있어 실제 발송 없음."
          fi
          if [ "$FAILED" != "0" ]; then
            echo "::warning::부분 실패 — $FAILED/$TOTAL 실패. Supabase 로그에서 rid=$REQ_ID 확인."
          fi
