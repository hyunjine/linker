# Supabase DB 마이그레이션 적용 자동화 (#430, #348 후속).
#
# 배경: 지금까지 마이그레이션은 Supabase MCP (`apply_migration`) 로 프로덕션에 수동 적용했다.
# MCP 는 ledger (`supabase_migrations.schema_migrations`) 에 자기 timestamp 를 version 으로 찍어
# repo 파일명과 어긋났고, 그래서 `supabase db push` 를 붙일 수 없었다. #430 에서 repo 파일을
# ledger 와 1:1 로 맞췄으므로 (rename 35 · ledger 에서 복원 11), 이제부터는 이 워크플로만
# 프로덕션에 마이그레이션을 적용한다. **MCP · SQL Editor 로 직접 적용 금지.**
#
# 흐름: 마이그레이션 PR → 개발 브랜치 (`develop/vX.Y.Z`, #433) 머지 → Actions 에서 `production` environment 승인 → 이 job 이 적용.
#
# 트리거 정책:
#   - 개발 브랜치 (`develop/**`) push 시 실행 (release 는 무관)
#   - `supabase/migrations/**` · 워크플로 자체 변경일 때만 실행
#   - Actions 탭에서 `workflow_dispatch` 로 수동 트리거 가능 (적용 대기분 재시도용)
#
# 승인 게이트:
#   - job 이 GitHub Environment `production` 에 묶여 있어, required reviewer (repo 오너) 가
#     Actions 화면에서 "Review deployments → Approve" 하기 전엔 시작되지 않는다 (environment 시크릿도 미노출).
#   - 승인 전에 PR diff · 아래 dry-run 로그로 무엇이 적용될지 확인할 것.
#
# 시크릿:
#   - `SUPABASE_PROJECT_REF`  — 프로젝트 ref. supabase-deploy.yml 과 동일한 이유로 secret 보관.
#   - `SUPABASE_DB_PASSWORD`  — 프로덕션 Postgres 비밀번호 (dashboard → Project Settings → Database).
#     `production` environment secret (승인 이후 job 에만 노출). 아래에서 URL-encode 해 접속 URL 을 만든다.
#
# `supabase link` 를 쓰지 않는 이유 (#441):
#   - link 는 Management API 로 프로젝트 상태를 조회하며 `project_admin_read` 권한이 필요하다.
#     repo secret `SUPABASE_ACCESS_TOKEN` 은 함수 배포 (supabase-deploy.yml) 용 scoped token 이라
#     이 권한이 없어 실패했다 (run 44440656056). 그래서 Management API 를 거치지 않고
#     `--db-url` 로 Postgres 에 직접 붙는다 → access token 불필요.
#   - 접속 대상은 Supavisor **session pooler** (port 5432). GitHub runner 는 IPv6 가 없어
#     direct host (`db.<ref>.supabase.co`, IPv6 전용) 엔 못 붙고, transaction pooler (6543) 는
#     prepared statement · 세션 상태를 쓰는 마이그레이션에 부적합.

name: Supabase Migrate

on:
  push:
    branches: ["develop/**"]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrate.yml"
  workflow_dispatch: {}   # 수동 트리거 = 원격에 없는 마이그레이션 적용 재시도.

# 마이그레이션은 순서가 중요 → 동시에 두 개 돌지 않게 직렬화. 진행 중인 apply 는 취소하지 않음.
concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      # session pooler host — 비밀 아님. 로컬에서 full 권한 토큰으로 `supabase link` 한 뒤
      # `supabase/.temp/pooler-url` 에 기록된 값 (Seoul · ap-northeast-2). 프로젝트 이전 시 갱신.
      SUPABASE_POOLER_HOST: aws-0-ap-northeast-2.pooler.supabase.com
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # latest 는 GitHub API 로 최신 릴리스를 조회하다 rate limit 에 걸려 실패한 적이 있어 고정.
          # supabase-deploy.yml 과 같은 버전 유지.
          version: 2.118.0

      - name: Verify secrets
        run: |
          echo "SUPABASE_PROJECT_REF  : $([ -n "$SUPABASE_PROJECT_REF" ] && echo present || echo MISSING)"
          echo "SUPABASE_DB_PASSWORD  : $([ -n "$SUPABASE_DB_PASSWORD" ] && echo present || echo MISSING)"
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::필수 secret 누락 (Settings → Environments → production 또는 Secrets and variables → Actions 확인)"
            exit 1
          fi

      # 비밀번호에 `!` `@` `/` `%` 등이 있어도 URL 이 깨지지 않게 percent-encode (CLI 도 encoded URL 을 요구).
      # 인코딩된 비밀번호를 mask 한 뒤 GITHUB_ENV 로 넘긴다. URL 자체는 절대 echo 하지 않는다.
      - name: Build DB URL
        run: |
          ENCODED=$(python3 -c 'import urllib.parse,os;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          echo "::add-mask::$ENCODED"
          echo "SUPABASE_DB_URL=postgresql://postgres.${SUPABASE_PROJECT_REF}:${ENCODED}@${SUPABASE_POOLER_HOST}:5432/postgres" >> "$GITHUB_ENV"

      # local (repo 파일) vs remote (ledger) 비교를 로그에 남긴다.
      # remote 에만 있는 version 이 있으면 (= 누가 MCP 로 직접 적용) 아래 db push 가 에러로 멈춘다.
      - name: Migration list (before)
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Dry run
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Migration list (after)
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Summary
        if: always()
        run: |
          {
            echo "### 🗄️ Supabase Migrate"
            echo ""
            echo "| 필드 | 값 |"
            echo "|---|---|"
            echo "| trigger | \`${{ github.event_name }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| project | \`${{ secrets.SUPABASE_PROJECT_REF }}\` |"
            echo ""
            echo "적용 내역은 'Dry run' · 'Apply migrations' step 로그 참고."
          } >> "$GITHUB_STEP_SUMMARY"
