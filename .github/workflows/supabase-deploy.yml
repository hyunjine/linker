# Supabase Edge Function 배포 자동화 (#348).
#
# 배경: 이전엔 Supabase 관련 배포가 전면 수동 (MCP · CLI) 이라 함수/마이그레이션 파일이
# dev 에 머지돼도 프로덕션에 안 올라가 있는 상태가 발생했다. v1.4.0 릴리즈 워크플로가
# 그때 처음 fire 된 `broadcast-release-note` 를 호출해 404 로 실패한 게 대표 사례.
#
# 이 워크플로는 **함수 배포만** 담당한다. 함수는 새 버전 push 만 있고 파괴적 롤백이 없어 안전.
# 마이그레이션 적용은 `supabase-migrate.yml` (#430) 이 담당.
#
# 승인 게이트 (#430):
#   - 실제 배포 job (`deploy-functions`) 은 GitHub Environment `production` 에 묶여 있어
#     required reviewer (repo 오너) 승인 후에만 실행된다. 마이그레이션 워크플로와 같은 게이트.
#   - 배포 대상 산정 (`detect`) 은 시크릿이 필요 없어 environment 밖에서 먼저 돈다.
#     대상이 없으면 (예: functions/README.md 만 수정) 배포 job 자체가 skip 되어 승인 요청도 안 뜬다.
#
# 트리거 정책:
#   - `dev` 브랜치 push 시 실행 (release/main 은 무관 — release 는 태그/브로드캐스트만)
#   - `supabase/functions/**` · 워크플로 자체 변경일 때만 실행 → CI 분 절약
#   - Actions 탭에서 `workflow_dispatch` 로 수동 트리거 가능 (전체 함수 강제 재배포용)
#
# 시크릿:
#   - `SUPABASE_ACCESS_TOKEN` — Supabase Personal Access Token (dashboard → Account → Access Tokens).
#     CLI 가 프로젝트 조작할 때 사용. Actions Secrets 에 저장.
#   - `SUPABASE_PROJECT_REF` — 프로젝트 ref (예: guxpohhhacljwhyiskdk). URL 의 서브도메인 부분.
#     Secret 로 두는 이유: 코드 · 로그에 프로덕션 project ref 가 조용히 노출되는 상황 방지.

name: Supabase Deploy

on:
  push:
    branches: [dev]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch: {}   # 수동 트리거 = 모든 함수 강제 재배포. push 트리거는 변경된 것만.

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      funcs: ${{ steps.detect.outputs.funcs }}
    steps:
      - name: Checkout (full history for path-filter)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 배포 대상 함수 이름을 뽑는다.
      #   - workflow_dispatch: `supabase/functions/*/` 디렉터리 전체.
      #   - push:              해당 push 에서 변경된 함수 디렉터리만 (README.md 같이 dir 밖 파일은 제외).
      # 두 경로 다 `find -type d` 로 실제 존재하는 함수 디렉터리 집합만 신뢰 소스로 삼고,
      # push 는 그 집합을 diff 결과와 교집합해 안전하게 축소한다.
      - name: Detect functions to deploy
        id: detect
        run: |
          set -euo pipefail

          ALL_FUNCS=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d -exec basename {} \; \
            | grep -Ev '^_' | sort -u)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FUNCS="$ALL_FUNCS"
            echo "mode=dispatch" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              # 브랜치 생성/최초 push 는 diff 산정 불가 → 안전하게 skip (수동 dispatch 로 처리).
              FUNCS=""
              echo "mode=first_push_noop" >> "$GITHUB_OUTPUT"
            else
              # `supabase/functions/<name>/<file>` 처럼 4-세그먼트 이상만 후보 → README.md 등 dir 밖 파일 배제.
              CHANGED_DIRS=$(git diff --name-only "$BEFORE" "$AFTER" -- supabase/functions/ \
                | awk -F/ 'NF>=4 {print $3}' | sort -u)
              # 실제 존재하는 함수 dir 집합과 교집합.
              FUNCS=$(comm -12 <(echo "$ALL_FUNCS") <(echo "$CHANGED_DIRS") || true)
              echo "mode=changed" >> "$GITHUB_OUTPUT"
            fi
          fi

          if [ -z "$FUNCS" ]; then
            echo "배포 대상 없음."
            echo "funcs=" >> "$GITHUB_OUTPUT"
          else
            echo "배포 대상:"
            echo "$FUNCS" | sed 's/^/  - /'
            echo "funcs=$(echo $FUNCS | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

  deploy-functions:
    needs: detect
    if: needs.detect.outputs.funcs != ''
    runs-on: ubuntu-latest
    environment: production   # 오너 승인 후 실행 (#430).
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # latest 는 GitHub API 로 최신 릴리스를 조회하다 rate limit 에 걸려 실패한 적이 있어 고정.
          version: 2.118.0

      - name: Verify secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "SUPABASE_ACCESS_TOKEN : $([ -n "$SUPABASE_ACCESS_TOKEN" ] && echo present || echo MISSING)"
          echo "SUPABASE_PROJECT_REF  : $([ -n "$SUPABASE_PROJECT_REF" ] && echo present || echo MISSING)"
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::필수 secret 누락 (Settings → Secrets and variables → Actions 확인)"
            exit 1
          fi

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          for fn in ${{ needs.detect.outputs.funcs }}; do
            echo "── deploy $fn ──"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Summary
        run: |
          {
            echo "### 🚀 Supabase Function Deploy"
            echo ""
            echo "| 필드 | 값 |"
            echo "|---|---|"
            echo "| mode | \`${{ needs.detect.outputs.mode }}\` |"
            echo "| functions | \`${{ needs.detect.outputs.funcs }}\` |"
            echo "| project | \`${{ secrets.SUPABASE_PROJECT_REF }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
