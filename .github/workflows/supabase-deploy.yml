# Supabase Edge Function 배포 자동화 (#348).
#
# 배경: 이전엔 Supabase 관련 배포가 전면 수동 (MCP · CLI) 이라 함수/마이그레이션 파일이
# dev 에 머지돼도 프로덕션에 안 올라가 있는 상태가 발생했다. v1.4.0 릴리즈 워크플로가
# 그때 처음 fire 된 `broadcast-release-note` 를 호출해 404 로 실패한 게 대표 사례.
#
# 이 워크플로는 우선 **함수 배포만** 자동화한다. 함수는 새 버전 push 만 있고 파괴적 롤백이
# 없어 안전. 마이그레이션 자동 apply 는 별도 단계 (#348 후속) — MCP 로 apply 된 이력이
# ledger 에 있는 상태라 `supabase db push` 가 재적용을 시도할 위험이 있어 ledger repair
# 스크립트 도입 후 붙일 예정.
#
# 트리거 정책:
#   - `dev` 브랜치 push 시 실행 (release/main 은 무관 — release 는 태그/브로드캐스트만)
#   - `supabase/functions/**` · 워크플로 자체 변경일 때만 실행 → CI 분 절약
#   - Actions 탭에서 `workflow_dispatch` 로 수동 트리거 가능 (전체 함수 강제 재배포용)
#
# 시크릿:
#   - `SUPABASE_ACCESS_TOKEN` — Supabase Personal Access Token (dashboard → Account → Access Tokens).
#     CLI 가 프로젝트 조작할 때 사용. Actions Secrets 에 저장.
#   - `SUPABASE_PROJECT_REF` — 프로젝트 ref (예: guxpohhhacljwhyiskdk). URL 의 서브도메인 부분.
#     Secret 로 두는 이유: 코드 · 로그에 프로덕션 project ref 가 조용히 노출되는 상황 방지.

name: Supabase Deploy

on:
  push:
    branches: [dev]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:
    inputs:
      force_all:
        description: "전체 함수 강제 재배포 (변경 없어도)"
        type: boolean
        default: false

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history for path-filter)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "SUPABASE_ACCESS_TOKEN : $([ -n "$SUPABASE_ACCESS_TOKEN" ] && echo present || echo MISSING)"
          echo "SUPABASE_PROJECT_REF  : $([ -n "$SUPABASE_PROJECT_REF" ] && echo present || echo MISSING)"
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::필수 secret 누락 (Settings → Secrets and variables → Actions 확인)"
            exit 1
          fi

      # 변경된 함수 디렉터리만 추린다. `functions/<name>/` 어느 파일이든 바뀌면 그 함수 재배포.
      # workflow_dispatch + force_all=true 면 전체 함수 목록으로 대체.
      - name: Detect changed functions
        id: detect
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_all }}" = "true" ]; then
            FUNCS=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort -u | grep -v '^_' || true)
            echo "mode=force_all" >> "$GITHUB_OUTPUT"
          else
            # dev push: HEAD~1..HEAD 의 supabase/functions/ 변경분에서 두 번째 path 세그먼트만 추출.
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            # 최초 push (before = 000…000) 처럼 diff 불가한 케이스 방어 — HEAD 만 훑음.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git ls-tree -r --name-only HEAD -- supabase/functions/ | awk -F/ '{print $3}' | sort -u)
            else
              CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" -- supabase/functions/ | awk -F/ '{print $3}' | sort -u)
            fi
            # 빈 값 · 위계 밖 (`_shared` 계열) 제외.
            FUNCS=$(echo "$CHANGED" | grep -Ev '^(_.*|$)' | sort -u || true)
            echo "mode=changed" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$FUNCS" ]; then
            echo "배포할 함수 없음."
            echo "funcs=" >> "$GITHUB_OUTPUT"
          else
            echo "배포 대상:"
            echo "$FUNCS" | sed 's/^/  - /'
            # newline → space 로 압축해 다음 스텝 shell loop 에 넘김.
            echo "funcs=$(echo $FUNCS | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy functions
        if: steps.detect.outputs.funcs != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          for fn in ${{ steps.detect.outputs.funcs }}; do
            echo "── deploy $fn ──"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Summary
        run: |
          {
            echo "### 🚀 Supabase Function Deploy"
            echo ""
            echo "| 필드 | 값 |"
            echo "|---|---|"
            echo "| mode | \`${{ steps.detect.outputs.mode }}\` |"
            echo "| functions | \`${{ steps.detect.outputs.funcs }}\` |"
            echo "| project | \`${{ secrets.SUPABASE_PROJECT_REF }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
