name: Supabase keep-alive

# Supabase Free tier 는 7일간 요청이 없으면 프로젝트가 자동 pause 되어 로그인·데이터 API 가
# 갑자기 죽는다. 3일마다 REST 엔드포인트에 가벼운 GET 을 날려 슬립을 방지.
#
# 왜 cron-job.org 대신 GitHub Actions?
#  - 저장소가 public → 러너 무제한 · 계정 관리 불필요
#  - 워크플로 파일이 코드로 리뷰됨 · 히스토리 남음
#  - 실패 시 GitHub 알림이 저장소 오너에게 자동 발화
#
# 값은 client 에 그대로 임베드되는 publishable key/URL 이라 secret 이 아니어도 되지만,
# 로테이션·다른 환경 대응을 위해 GitHub Secrets 로 분리해둔다.
#  - SUPABASE_URL          — 예: https://<project>.supabase.co
#  - SUPABASE_PUBLISHABLE_KEY — sb_publishable_... (RLS 로 보호되는 값)
on:
  schedule:
    # 매 3일 03:00 UTC. `*/3` 은 day-of-month 필드라 월 경계에서 살짝 어긋나지만 (예: 30→1)
    # 어느 경우에도 7일을 넘기지 않아 pause 임계값 안쪽.
    - cron: "0 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST root
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          # -f: 4xx/5xx 시 exit 22 → job failure → 실패 알림 발화
          # -sS: 진행률 숨김 + 에러는 출력 (silent 로 삼키지 않음)
          # -w: 상태 코드만 로그에 남겨 대시보드에서 성공 여부 한눈에 확인
          curl -fsS \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/" \
            -o /dev/null \
            -w "http_status=%{http_code}\n"
