# release 브랜치 push/merge → GitHub Actions macOS 러너에서 iOS 앱을 빌드하고
# App Store Connect TestFlight 로 업로드. 기존 Xcode Cloud 대체.
#
# 필요한 Secrets (Settings → Secrets and variables → Actions):
#   - IOS_DIST_CERTIFICATE_BASE64      Apple Distribution p12 (base64)
#   - IOS_DIST_CERTIFICATE_PASSWORD    p12 암호
#   - IOS_KEYCHAIN_PASSWORD            러너 임시 keychain 잠금용 임의 문자열
#   - ASC_API_KEY_ID                   App Store Connect API Key ID (10자)
#   - ASC_API_ISSUER_ID                App Store Connect Issuer ID (UUID)
#   - ASC_API_KEY_BASE64               .p8 파일 base64
#   - KAKAO_NATIVE_APP_KEY             카카오 네이티브 앱 키
#   - GOOGLE_SERVICE_INFO_PLIST_BASE64 Firebase GoogleService-Info.plist (base64)
#
# 프로비저닝 프로필은 시크릿으로 직접 넣지 않고, xcodebuild `-allowProvisioningUpdates`
# + ASC API 키 인증으로 Apple 서버에서 자동 fetch (앱 · 위젯 익스텐션 모두 커버).
#
# 빌드 번호는 github.run_number 로 자동 증가. Marketing 버전은 VERSION 첫 줄에서.
# 태그·Release 자동생성은 별도 release.yml 이 담당 (두 워크플로가 병렬로 뜬다).
name: iOS TestFlight Deploy

on:
  push:
    branches: [release]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Parse VERSION
        id: version
        run: |
          VERSION=$(grep -m 1 '.' VERSION | tr -d '[:space:]')
          [ -z "$VERSION" ] && { echo "::error::VERSION first non-empty line missing"; exit 1; }
          echo "marketing=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "── marketing=$VERSION · build=${{ github.run_number }}"

      - name: Generate Config.xcconfig
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          : "${KAKAO_NATIVE_APP_KEY:?KAKAO_NATIVE_APP_KEY secret 미설정}"
          mkdir -p iosApp/Configuration
          cat > iosApp/Configuration/Config.xcconfig <<EOF
          TEAM_ID=YCCX589JXZ
          PRODUCT_NAME=Linker
          PRODUCT_BUNDLE_IDENTIFIER=com.hyunjine.linker
          CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }}
          MARKETING_VERSION=${{ steps.version.outputs.marketing }}
          KAKAO_NATIVE_APP_KEY=$KAKAO_NATIVE_APP_KEY
          EOF

      - name: Install Firebase GoogleService-Info.plist
        env:
          PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          : "${PLIST_BASE64:?GOOGLE_SERVICE_INFO_PLIST_BASE64 secret 미설정}"
          echo -n "$PLIST_BASE64" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist

      - name: Install signing certificate
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          : "${CERT_BASE64:?IOS_DIST_CERTIFICATE_BASE64 secret 미설정}"
          : "${CERT_PASSWORD:?IOS_DIST_CERTIFICATE_PASSWORD secret 미설정}"
          : "${KEYCHAIN_PASSWORD:?IOS_KEYCHAIN_PASSWORD secret 미설정}"

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/dist.p12"

          # 임시 keychain 생성 → 잠금 해제 → 6시간 자동 잠금.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # p12 임포트. `-A` 는 모든 앱 접근 허용 (codesign 프롬프트 방지).
          echo -n "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # codesign 이 이 keychain 을 non-interactive 로 쓰게 partition list 갱신.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 러너 login keychain 앞에 build keychain 추가.
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Install App Store Connect API key
        id: asc_key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          : "${ASC_KEY_ID:?ASC_API_KEY_ID secret 미설정}"
          : "${ASC_ISSUER_ID:?ASC_API_ISSUER_ID secret 미설정}"
          : "${ASC_KEY_BASE64:?ASC_API_KEY_BASE64 secret 미설정}"

          # altool 이 자동으로 찾는 규약 경로 (~/.appstoreconnect/private_keys) 에 배치 —
          # 업로드 단계 xcrun altool 이 --apiKey/--apiIssuer 만으로 인증하게 함.
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo -n "$ASC_KEY_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"

          # xcodebuild 가 `-allowProvisioningUpdates` 로 프로비저닝 프로필을 자동 fetch 하려면
          # 별도 경로에서 인증 키를 읽음. Path/ID/Issuer 를 다음 스텝에 아웃풋으로 전달.
          echo "path=$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_OUTPUT"
          echo "id=$ASC_KEY_ID" >> "$GITHUB_OUTPUT"
          echo "issuer=$ASC_ISSUER_ID" >> "$GITHUB_OUTPUT"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Linker.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc_key.outputs.path }}" \
            -authenticationKeyID "${{ steps.asc_key.outputs.id }}" \
            -authenticationKeyIssuerID "${{ steps.asc_key.outputs.issuer }}" \
            DEVELOPMENT_TEAM=YCCX589JXZ

      - name: Generate ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>YCCX589JXZ</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Linker.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc_key.outputs.path }}" \
            -authenticationKeyID "${{ steps.asc_key.outputs.id }}" \
            -authenticationKeyIssuerID "${{ steps.asc_key.outputs.issuer }}"

      - name: Upload to TestFlight
        run: |
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -n 1)
          [ -z "$IPA" ] && { echo "::error::export 결과 IPA 없음"; ls -la "$RUNNER_TEMP/export"; exit 1; }
          echo "── Uploading $IPA"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "${{ steps.asc_key.outputs.id }}" \
            --apiIssuer "${{ steps.asc_key.outputs.issuer }}"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
