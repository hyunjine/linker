# 로컬 개발용. `docker compose -f server/docker-compose.yaml up -d` 로 postgres 를 띄우고
# `./gradlew :server:run` 으로 서버를 붙인다.
# 배포용 Cloud SQL 은 이 compose 와 무관 — 그건 gcloud sql 로 별도 관리.

services:
  postgres:
    image: postgres:16
    container_name: linker-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: linker
      POSTGRES_PASSWORD: linker
      POSTGRES_DB: linker
    ports:
      - "5432:5432"
    volumes:
      - linker-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linker -d linker"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Web UI로 postgres 데이터 확인용. 필요 없으면 이 블록 삭제.
  adminer:
    image: adminer:4
    container_name: linker-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  linker-pg-data:
