ktor:
    application:
        modules:
            - com.hyunjine.linker.server.ApplicationKt.module
    deployment:
        # Fly.io 는 $PORT 환경변수를 주입한다. 로컬 기본은 8080.
        port: "$PORT:8080"
        host: "0.0.0.0"

server:
    # 서비스 세션 JWT 서명 키. 로컬은 dev 값, 배포에서는 fly secrets 로 주입.
    jwtSecret: "$JWT_SECRET:dev-only-secret-change-me"
    jwtIssuer: "$JWT_ISSUER:linker.local"
    jwtRealm: "$JWT_REALM:linker"

kakao:
    # 카카오 REST API Key. 네이티브 SDK 로그인이면 필수 아님.
    restApiKey: "$KAKAO_REST_API_KEY:"

db:
    # 로컬: local.properties 의 db.* 를 gradle run task 가 env 로 자동 주입 (#30).
    # 배포: fly secrets set DB_URL=... 로 주입.
    url: "$DB_URL:jdbc:postgresql://localhost:5432/linker"
    user: "$DB_USER:linker"
    password: "$DB_PASSWORD:linker"
    maxPoolSize: "$DB_MAX_POOL_SIZE:5"
