#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# Kotlin/Native 의 klib 부분 캐시를 끈다. Xcode 빌드 시 shared 코드를 수정해도 이 캐시가
# up-to-date 로 판단되면 재컴파일이 스킵돼 실기기/시뮬레이터에 stale 코드가 실리는
# 케이스를 근본 차단. 첫 빌드는 20~30s 느려지지만 캐시 스테일 이슈가 사라진다.

#Gradle
# -XX:+UseParallelGC: 데몬 JVM 의 GC 오버헤드 감소 (기본 G1 대비 짧은 작업 유리)
# -Xshare:auto: CDS(class data sharing) 로 JVM 부팅 단축
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:+UseParallelGC -Xshare:auto
org.gradle.configuration-cache=true
org.gradle.caching=true
# 모듈 간 독립 태스크 병렬 실행 (shared linkDebugFrameworkIosSimulatorArm64 ↔ IosArm64 처럼).
org.gradle.parallel=true
# Gradle daemon 명시 (기본값 true 이지만 명시적으로).
org.gradle.daemon=true
# 의존성 다운로드 네트워크 일시 오류 대비 (#376). Xcode Cloud 러너에서 github.com 연결 시간 초과로
# kotlin-compiler-embeddable 을 못 받아 아카이브가 실패한 적 있음. 재시도 3→6회 · 첫 대기 1s→2s,
# 연결 · 소켓 시간 제한을 넉넉히.
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
